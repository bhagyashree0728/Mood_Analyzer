<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sentiment-positive { color: green; }
        .sentiment-negative { color: red; }
        .post-card { margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Mood Detector</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Analyze New Post</h5>
                        <form id="postForm">
                            <div class="mb-3">
                                <label for="postText" class="form-label">Enter your social media post:</label>
                                <textarea class="form-control" id="postText" rows="3" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="sourceSelect" class="form-label">Select source:</label>
                                <select class="form-select" id="sourceSelect">
                                    <option value="Twitter">Twitter</option>
                                    <option value="Facebook">Facebook</option>
                                    <option value="Instagram">Instagram</option>
                                    <option value="LinkedIn">LinkedIn</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">Analyze</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Analysis Results</h5>
                        <div id="results">
                            <p>No analysis yet. Submit a post to see results.</p>
                        </div>
                        <div id="sentimentPlot" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <h3>Previous Posts</h3>
                <div id="postsList"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const post = document.getElementById('postText').value;
            const source = document.getElementById('sourceSelect').value;
            
            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ post, source }),
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Update results
                    document.getElementById('results').innerHTML = `
                        <p>Sentiment: <span class="sentiment-${data.sentiment.toLowerCase()}">${data.sentiment}</span></p>
                        <p>Confidence: ${(data.confidence * 100).toFixed(1)}%</p>
                        <p>Total Posts Analyzed: ${data.total_posts}</p>
                    `;
                    
                    // Update plot if available
                    if (data.sentiment_plot) {
                        document.getElementById('sentimentPlot').innerHTML = `
                            <img src="data:image/png;base64,${data.sentiment_plot}" class="img-fluid" alt="Sentiment Distribution">
                        `;
                    }
                    
                    // Clear form
                    document.getElementById('postText').value = '';
                    
                    // Refresh posts list
                    loadPosts();
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while analyzing the post.');
            }
        });

        async function loadPosts() {
            try {
                const response = await fetch('/posts');
                const posts = await response.json();
                
                const postsList = document.getElementById('postsList');
                postsList.innerHTML = posts.map(post => `
                    <div class="card post-card">
                        <div class="card-body">
                            <h6 class="card-subtitle mb-2 text-muted">${post.source} - ${post.timestamp}</h6>
                            <p class="card-text">${post.text}</p>
                            <p class="card-text">
                                <small class="sentiment-${post.sentiment.toLowerCase()}">
                                    Sentiment: ${post.sentiment} (${(post.confidence * 100).toFixed(1)}%)
                                </small>
                            </p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading posts:', error);
            }
        }

        // Load posts on page load
        loadPosts();
    </script>
</body>
</html>
